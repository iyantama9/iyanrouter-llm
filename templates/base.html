<!DOCTYPE html>
<html lang="en" x-data="{ dark: true }" :class="dark ? 'dark' : ''">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Iyan Router{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="alternate icon" href="/static/favicon.svg">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            card: 'hsl(var(--card))',
            'card-foreground': 'hsl(var(--card-foreground))',
            primary: 'hsl(var(--primary))',
            'primary-foreground': 'hsl(var(--primary-foreground))',
            secondary: 'hsl(var(--secondary))',
            'secondary-foreground': 'hsl(var(--secondary-foreground))',
            muted: 'hsl(var(--muted))',
            'muted-foreground': 'hsl(var(--muted-foreground))',
            accent: 'hsl(var(--accent))',
            'accent-foreground': 'hsl(var(--accent-foreground))',
            destructive: 'hsl(var(--destructive))',
            'destructive-foreground': 'hsl(var(--destructive-foreground))',
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
            ring: 'hsl(var(--ring))',
          },
          fontFamily: {
            display: ['"Syne"', 'sans-serif'],
            body: ['"Outfit"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          borderRadius: {
            lg: 'var(--radius)',
            md: 'calc(var(--radius) - 2px)',
            sm: 'calc(var(--radius) - 4px)',
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --background: 0 0% 98%;
      --foreground: 0 0% 8%;
      --card: 0 0% 100%;
      --card-foreground: 0 0% 8%;
      --primary: 0 0% 12%;
      --primary-foreground: 0 0% 100%;
      --secondary: 0 0% 93%;
      --secondary-foreground: 0 0% 8%;
      --muted: 0 0% 93%;
      --muted-foreground: 0 0% 34%;
      --accent: 0 0% 38%;
      --accent-foreground: 0 0% 100%;
      --destructive: 0 72% 51%;
      --destructive-foreground: 0 0% 100%;
      --border: 0 0% 88%;
      --input: 0 0% 88%;
      --ring: 0 0% 12%;
      --radius: 0.875rem;
    }

    .dark {
      --background: 0 0% 8%;
      --foreground: 0 0% 92%;
      --card: 0 0% 7%;
      --card-foreground: 0 0% 92%;
      --primary: 0 0% 96%;
      --primary-foreground: 0 0% 8%;
      --secondary: 0 0% 11%;
      --secondary-foreground: 0 0% 92%;
      --muted: 0 0% 11%;
      --muted-foreground: 0 0% 82%;
      --accent: 0 0% 70%;
      --accent-foreground: 0 0% 8%;
      --destructive: 0 72% 51%;
      --destructive-foreground: 0 0% 100%;
      --border: 0 0% 15%;
      --input: 0 0% 11%;
      --ring: 0 0% 96%;
    }

    /* Interactive dot grid.

       This lives on its own fixed layer rather than on body/.grid-bg. The
       previous version set an animated `color` on those elements so the dot
       gradient could use currentColor -- but `color` inherits, so every bit
       of text without an explicit colour inherited the animation too and
       visibly flickered. Nothing here touches text colour. */
    .dot-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      --dot-size: 26px;
      --dot-base: rgba(255, 255, 255, 0.13);
      --dot-hot: rgba(255, 255, 255, 0.85);
      --spot: 190px;
      background-image: radial-gradient(var(--dot-base) 1.3px, transparent 1.3px);
      background-size: var(--dot-size) var(--dot-size);
    }
    html:not(.dark) .dot-layer {
      --dot-base: rgba(0, 0, 0, 0.11);
      --dot-hot: rgba(0, 0, 0, 0.6);
    }

    /* Brighter copy of the same grid, revealed only around the cursor. */
    .dot-layer::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(var(--dot-hot) 1.5px, transparent 1.5px);
      background-size: var(--dot-size) var(--dot-size);
      -webkit-mask-image: radial-gradient(circle var(--spot) at var(--mx, -999px) var(--my, -999px), #000 0%, rgba(0,0,0,0.35) 45%, transparent 72%);
      mask-image: radial-gradient(circle var(--spot) at var(--mx, -999px) var(--my, -999px), #000 0%, rgba(0,0,0,0.35) 45%, transparent 72%);
      transition: opacity 0.3s ease;
      opacity: 0;
    }
    .dot-layer.is-active::after { opacity: 1; }

    @media (prefers-reduced-motion: reduce) {
      .dot-layer::after { transition: none; }
    }

    /* Force readable body text in rendered markdown regardless of whether the
       Tailwind Typography plugin loaded from the CDN build — it isn't
       guaranteed, and its default palette runs dimmer than our tokens. */
    .prose {
      color: hsl(var(--foreground));
    }
    .prose :where(p, li, strong, b, em, blockquote, h1, h2, h3, h4, h5, h6, td, th) {
      color: inherit;
    }
    .prose code {
      color: hsl(var(--foreground));
    }
    .prose a {
      color: hsl(var(--primary));
    }
    /* Chat images: clamp so a large generation can't blow out the bubble,
       and signal that clicking downloads it. */
    .prose img.chat-image {
      max-width: 100%;
      max-height: 420px;
      height: auto;
      border-radius: 0.75rem;
      border: 1px solid hsl(var(--border));
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .prose img.chat-image:hover { opacity: 0.85; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: hsl(var(--border)); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: hsl(var(--muted-foreground)); }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .animate-shimmer {
      background: linear-gradient(90deg, hsl(var(--secondary)) 25%, hsl(var(--muted)) 50%, hsl(var(--secondary)) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    @keyframes toast-in {
      from { transform: translateX(110%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .toast-enter {
      animation: toast-in 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Routing graph: a dash that marches from the hub out to the provider,
       so an in-flight request reads as something actually travelling the wire. */
    @keyframes connector-flow {
      from { stroke-dashoffset: 24; }
      to   { stroke-dashoffset: 0; }
    }
    .connector-live {
      stroke-dasharray: 6 6;
      animation: connector-flow 0.55s linear infinite;
      filter: drop-shadow(0 0 3px hsl(var(--primary) / 0.6));
    }

    @keyframes pulse-dot {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(3); opacity: 0; }
    }
    .pulse-ring::after {
      content: '';
      position: absolute; inset: 0; border-radius: 50%;
      background: inherit;
      animation: pulse-dot 2s ease-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .animate-shimmer { animation: none; background: hsl(var(--secondary)); }
      .pulse-ring::after { animation: none; }
      .connector-live { animation: none; stroke-dasharray: none; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="bg-background text-foreground font-body antialiased">
  <div class="dot-layer" id="dot-layer" aria-hidden="true"></div>
  {% block content %}{% endblock %}

  <script>
    // Feed the cursor position to the dot layer so the bright grid follows it.
    // rAF-throttled: mousemove fires far more often than we can paint.
    (function () {
      var layer = document.getElementById('dot-layer');
      if (!layer) return;
      var x = 0, y = 0, queued = false;
      function paint() {
        queued = false;
        layer.style.setProperty('--mx', x + 'px');
        layer.style.setProperty('--my', y + 'px');
      }
      window.addEventListener('pointermove', function (e) {
        x = e.clientX; y = e.clientY;
        layer.classList.add('is-active');
        if (!queued) { queued = true; requestAnimationFrame(paint); }
      }, { passive: true });
      window.addEventListener('pointerleave', function () {
        layer.classList.remove('is-active');
      });
    })();
  </script>
  <script>lucide.createIcons();</script>
  {% block scripts %}{% endblock %}
</body>
</html>
